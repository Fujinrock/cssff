[General]
# Whether to dump frags/data to a text file
# Only relevant when parsing a single demo
dump_to_file=0

# Enable/disable batch processing of all demos in a folder (program folder by default) when no demo is specified
# Parsing more than one demo automatically enables dump_to_file (results are always dumped to file)
enable_batch_processing=1

# Should the output file be written to the folder where the processed demo/batch was or to the executable folder
write_output_to_demo_directory=1

# What kind of frags should be ticked
tick_5ks=1
tick_4ks=1
tick_3ks=1
tick_doubles=1
tick_triples=1
tick_quadros=1
tick_pentas=1
tick_flash_smoke_kills=1
tick_jumpshots=1
tick_noscopes=1
tick_flickshots=1
tick_wallbangs=0
tick_frags_vs_bots=0
tick_frags_by_bots=1

# Maximum time between first and last kill to tick 3/4/5 kills (negative number means unlimited time)
5k_max_time=13
4k_max_time=6.5
3k_max_time=2

# Whether long frags in one spot should be ticked regardless of time
tick_slow_stationary_5ks=1
tick_slow_stationary_4ks=0
tick_slow_stationary_3ks=0
slow_5k_max_range=300
slow_4k_max_range=0
slow_3k_max_range=0

# Requirements for ticking certain types of frags
5k_min_headshots=0
4k_min_headshots=0
3k_min_headshots=2

double_min_headshots=1
triple_min_headshots=0
quadro_min_headshots=0
penta_min_headshots=0

# Special collats are flicks, jumpshots, noscopes, wallbangs or done while flashed
special_double_ignores_min_hs=true
special_triple_ignores_min_hs=true
special_quadro_ignores_min_hs=true
special_penta_ignores_min_hs=true

wallbang_headshot_only=1
wallbang_require_two=1
wallbang_another_wallbang_max_delta_time=4.0

flickshot_headshot_only=0
flickshot_min_distance=120
flickshot_min_angle_modifier=1.0

# Maximum flick duration in milliseconds
flickshot_max_duration=170

jumpshot_min_post_kill_air_time=0.11
jumpshot_min_distance=800
jumpshot_min_distance_hs_modifier=0.65
jumpshot_min_distance_wb_modifier=0.65
jumpshot_always_tick_multiple=true
jumpshot_multiple_max_delta_time=2.0

# Special kills here mean flicks, jumpshots, noscopes, wallbangs or flashed kills
5k_must_include_special_kill=false
4k_must_include_special_kill=false
3k_must_include_special_kill=false

# How many seconds each special kill should raise the max time for ticking 3/4/5 kills
5k_special_kill_extra_max_time=3.0
4k_special_kill_extra_max_time=1.0
3k_special_kill_extra_max_time=0.5

